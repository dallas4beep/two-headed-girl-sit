      border-color: #ccff00;

      color: #0a0a0a;
      border: 0;
      padding: .9rem 1.6rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .contact-form button:disabled { opacity: .5; cursor: wait; }
    .contact-form .status {
      font-size: .8rem;
      color: #ccff00;
